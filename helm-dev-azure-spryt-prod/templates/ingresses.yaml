apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: abi-fe-nginx-ingress
  namespace: production
  annotations:
    kubernetes.io/ingress.class: abi-fe-nginx-ingress
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: abi-fe-service
            port:
              number: 80
---

apiVersion: v1
kind: Service
metadata:
  name: abi-fe-service
  namespace: production
  labels:
    app: abi-fe
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: abi-fe