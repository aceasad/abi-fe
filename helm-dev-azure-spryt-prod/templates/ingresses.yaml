apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: abi-fe-nginx-ingress
  namespace: production
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-frontend"
spec:
  ingressClassName: abi-fe-nginx-ingress
  tls:
  - hosts:
    - prod.spryt.com
    secretName: frontend-tts
  rules:
  - host: prod.spryt.com
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: abi-fe-service
            port:
              number: 80
---

apiVersion: v1
kind: Service
metadata:
  name: abi-fe-service
  namespace: production
  labels:
    app: abi-fe
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: abi-fe