apiVersion: secret-sync.gke.io/v1
kind: SecretSync
metadata:
  name: abi-fe-secrets
  namespace: spryt-dev
spec:
  serviceAccountName: abi-fe
  secretProviderClassName: abi-fe-secrets
  secretObject:
    type: Opaque
    data:
      - sourcePath: "CAPTCHA_CLIENT_KEY_V2"
        targetKey: "CAPTCHA_CLIENT_KEY_V2"
