apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-fe-ingress
  namespace: spryt-dev
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-frontend
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - dev.spryt.com
    secretName: frontend-tts
  rules:
  - host: dev.spryt.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: abi-fe-service
            port:
              number: 80

---

## abi-fe K8S SERVICES
# abi-fe k8s service
apiVersion: v1
kind: Service
metadata:
  name: abi-fe-service
  namespace: spryt-dev
  labels:
    app: abi-fe
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: abi-fe

